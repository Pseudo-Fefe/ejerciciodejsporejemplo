<script>
const doAsyncStuffWithCallback = (numero1, numero2, callback) => {
    const resultado = numero1 + numero2
    return setTimeout(() => {
        callback(resultado)
    }, 500)
}

doAsyncStuffWithCallback(1, 3, (result) => {
    console.log(result)
})
</script>
